<!DOCTYPE html>

  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

  <!-- Standalone on purpose: no kit CSS/JS, so it loads instantly on conference wifi.
       Linked from the QR code. Permanently noindex (a QR utility page, not SEO content). -->
  <style>
    :root {
      --bg: #ffffff; --text: #111111; --muted: #6b6b6b; --line: #dcdcdc;
      --btn-bg: #111111; --btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a0a0a; --text: #f4f4f4; --muted: #9a9a9a; --line: #2e2e2e; --btn-bg: #f4f4f4; --btn-text: #0a0a0a; }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .banner { position: relative; max-width: 480px; margin: 0 auto; }
    .banner img { display: block; width: 100%; height: auto; aspect-ratio: 790 / 593; object-fit: cover; background: var(--line); }
    .banner::after {
      content: ""; position: absolute; inset: auto 0 0 0; height: 24%; pointer-events: none;
      background: linear-gradient(to top, var(--bg), transparent);
    }
    .wrap {
      max-width: 440px; margin: 0 auto;
      padding: 1rem 1.25rem calc(2rem + env(safe-area-inset-bottom));
    }
    .id { text-align: center; }
    .hello { margin: 0 0 .25rem; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
    h1 { margin: 0; font: 700 1.9rem/1.15 'Archivo', system-ui, sans-serif; letter-spacing: -0.01em; }
    .tag { margin: .55rem 0 0; color: var(--text); font-size: 1rem; }
    .sub { margin: .3rem 0 0; color: var(--muted); font-size: .9rem; }

    .links { display: grid; gap: .7rem; margin: 1.9rem 0 0; }
    .btn {
      display: flex; align-items: center; gap: .85rem; min-height: 56px; padding: 0 1.1rem;
      border: 1.5px solid var(--text); color: var(--text); text-decoration: none; background: transparent;
      font: 600 .86rem/1 'Inter', system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
      transition: background .15s, color .15s;
    }
    .btn svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .btn .go { margin-left: auto; opacity: .55; font-size: 1.05rem; letter-spacing: 0; }
    .btn:active { background: var(--text); color: var(--bg); }
    .btn.primary { background: var(--btn-bg); color: var(--btn-text); border-color: var(--btn-bg); }
    .btn.primary:active { opacity: .85; }
    @media (hover: hover) {
      .btn:hover { background: var(--text); color: var(--bg); }
      .btn.primary:hover { opacity: .85; background: var(--btn-bg); color: var(--btn-text); }
    }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

    .more { margin: 1.6rem 0 0; text-align: center; font-size: .88rem; color: var(--muted); }
    .more a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); margin: 0 .35rem; padding-bottom: 1px; }
    .more a:hover, .more a:focus-visible { color: var(--text); border-color: var(--text); }
    .work { margin: 1.6rem 0 0; text-align: center; font-size: .92rem; }
    .work a { white-space: nowrap; color: var(--text); font-weight: 500; text-decoration: none; border-bottom: 1.5px solid var(--text); padding-bottom: 1px; }
    .foot { margin: 2.2rem 0 0; text-align: center; font-size: .78rem; letter-spacing: .08em; color: var(--muted); }
    .foot a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div class="banner">
    <img src="/assets/hi-banner.webp" width="790" height="593" alt="Matt Rae speaking into a microphone on stage" fetchpriority="high" />
  </div>

        Save my contact <span class="go">↓</span>

        LinkedIn <span class="go">→</span>

      <a class="btn" href="https://www.instagram.com/heymattrae/" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        Instagram <span class="go">→</span>
      </a>
      <a class="btn" href="mailto:matt@mattrae.ca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>

        mattrae.ca <span class="go">→</span>

    </nav>

    <p class="work">Web design, photography &amp; workshops → <a href="/work-with-me">Work with me</a></p>

    <p class="foot"><a href="/">mattrae.ca</a></p>
  </main>
</body>
</html>
