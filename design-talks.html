<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Speaking — Matt Rae</title>
  <!-- The old /design-talks page was merged into /speaker ("Talks & presentations").
       GitHub Pages has no redirect engine, so this is a static meta-refresh stub —
       Google treats an instant refresh + canonical as a permanent redirect.
       Vercel handles this via the redirects array in vercel.json instead. -->
  <link rel="canonical" href="https://mattrae.ca/speaker" />
  <meta http-equiv="refresh" content="0; url=/speaker" />
  <script>location.replace("/speaker" + location.hash);</script>
  <style>body{font:16px/1.5 system-ui,sans-serif;margin:15vh auto;max-width:32rem;padding:0 1.5rem;text-align:center}</style>
</head>
<body>
  <p>This page moved to <a href="/speaker">the speaking page</a>.</p>
</body>
</html>
